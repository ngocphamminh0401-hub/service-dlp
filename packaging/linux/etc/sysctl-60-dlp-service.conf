# [Thay đổi] File mới (GĐ4, tồn đọng GĐ3): nâng giới hạn số thư mục được theo dõi bằng inotify cho MỖI tài khoản.
# Mặc định trên máy cũ thường là 8192 — một thư mục home vừa phải đã vượt (đo GĐ3: 9.000 thư mục → 1.656 thư mục không theo dõi được;
# giới hạn tính chung cho mọi chương trình của tài khoản). Kernel chỉ tốn bộ nhớ cho watch ĐANG DÙNG (~1 KB/watch), không tốn cho con số giới hạn.
# Cài vào /etc/sysctl.d/60-dlp-service.conf. Nếu máy đã đặt giá trị cao hơn ở file có số lớn hơn (VD 99-*.conf) thì giá trị đó thắng.
fs.inotify.max_user_watches = 524288
